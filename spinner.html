<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DSU Spinner</title>
  <link rel="icon" href="icons/icon32.png">
  <link rel="stylesheet" href="spinner.css">
</head>
<body>
  <div class="app" id="app">
    <header class="top">
      <h1>Stand-up</h1>
      <span class="count" id="count"></span>
      <div class="actions">
        <button class="icon-btn" id="settingsBtn" title="Settings" aria-label="Settings" aria-pressed="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 7h-9"/><path d="M14 17H5"/><circle cx="17" cy="17" r="3"/><circle cx="7" cy="7" r="3"/></svg>
        </button>
        <button class="icon-btn" id="resetBtn" title="Reset today" aria-label="Reset">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v4.5h4.5"/></svg>
        </button>
        <button class="icon-btn embed-only" id="minBtn" title="Minimise" aria-label="Minimise">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 12h12"/></svg>
        </button>
        <button class="icon-btn embed-only" id="sizeBtn" title="Dock / expand" aria-label="Toggle panel size">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6"/><path d="M9 21H3v-6"/><path d="M21 3l-7 7"/><path d="M3 21l7-7"/></svg>
        </button>
        <button class="icon-btn embed-only" id="closeBtn" title="Hide (Esc, Alt+Shift+S)" aria-label="Hide spinner">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12"/><path d="M18 6L6 18"/></svg>
        </button>
      </div>
    </header>

    <main class="stage">
      <section class="wheel-zone">

        <div class="wheel-wrap" id="wheelWrap">
          <svg class="pointer" id="pointer" viewBox="0 0 40 48" aria-hidden="true">
            <path d="M20 46 L6 10 A15 15 0 0 1 34 10 Z" />
          </svg>
          <canvas id="wheel" aria-label="Spinner wheel"></canvas>
          <!-- Hung off the pointer once everyone has had a turn -->
          <svg class="sign" id="sign" viewBox="0 0 300 190" aria-label="That's all for today" role="img" hidden>
            <g class="swing">
              <path class="string" d="M150 4 L69.5 82" />
              <path class="string" d="M150 4 L228.3 101.5" />
              <g transform="rotate(7 70 78)">
                <rect class="board" x="34" y="68" width="232" height="96" rx="12" />
                <circle class="nail" cx="70" cy="82" r="4" />
                <circle class="nail" cx="230" cy="82" r="4" />
                <text x="150" y="108">That's all</text>
                <text x="150" y="146">for today</text>
              </g>
            </g>
          </svg>
          <button class="spin-btn" id="spinBtn" title="Space">Spin</button>
        </div>

        <div class="now" id="now" role="status" hidden>
          <strong class="now-name" id="nowName"></strong>
          <button class="text-btn strong" id="nowDone" title="Enter (Space spins next)">Done</button>
        </div>

        <div class="result" id="result" hidden>
          <div class="result-card" role="dialog" aria-labelledby="resultName">
            <div class="result-name" id="resultName"></div>
            <div class="result-actions">
              <button class="btn primary" id="resultStart" title="Enter">Start</button>
            </div>
            <button class="text-btn" id="resultSkip" title="S">Skip</button>
          </div>
        </div>
      </section>

      <aside class="team" id="team">
        <button class="team-toggle" id="teamBtn" aria-expanded="true" aria-controls="roster" title="T">
          Team
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
        </button>
        <div class="roster" id="roster"></div>
      </aside>
    </main>

    <section class="settings" id="settings" aria-labelledby="settingsTitle">
      <div class="settings-head">
        <h2 id="settingsTitle">Settings</h2>
        <button class="text-btn strong" id="settingsDone" title="Esc">Done</button>
      </div>
      <div class="setting">
        <span>Sound</span>
        <button class="toggle" id="soundToggle" role="switch" title="M" aria-label="Sound"></button>
      </div>
      <div class="settings-squads" id="settingsSquads"></div>
    </section>
  </div>
  <script type="module" src="spinner.js"></script>
</body>
</html>
